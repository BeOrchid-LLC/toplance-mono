name: End-to-end

# Post-merge and on demand — never per push to a branch. Every run signs
# real accounts into a Clerk **development** instance and deletes them
# again, so running it on every push would burn a dev instance's usage
# limits, and running two at once would make a shared environment's user
# list a race between branches.
#
# `push: main` is one run per merge rather than one per commit on a
# branch, and the `concurrency` group below serialises whatever is left:
# a queued run waits for the one in flight instead of signing a second
# set of accounts into the same instance. `cancel-in-progress` stays
# false on purpose — a cancelled run leaves its fixtures behind.
#
# Repository secrets it needs, both from the same Clerk *development*
# application (a production key makes the suite refuse to start):
#
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY   pk_test_…
#   CLERK_SECRET_KEY                    sk_test_…
#
# No OpenAI or Resend key is set, or wanted: the suite's own server
# blanks both so the intake runs its scripted path and no email leaves
# the runner.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: e2e-clerk-dev-instance
  cancel-in-progress: false

jobs:
  e2e:
    name: The four journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The same two containers a developer runs, on the same ports, from
      # the repo's own docker-compose.yml — Postgres *and* MinIO, because
      # the traveller journey uploads a real file to a real bucket.
      DATABASE_URL: postgres://toplance:toplance@127.0.0.1:54329/toplance
      S3_ENDPOINT: http://127.0.0.1:54330
      S3_REGION: us-east-1
      S3_BUCKET: documents
      S3_ACCESS_KEY_ID: toplance
      S3_SECRET_ACCESS_KEY: toplance123
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Start Postgres and MinIO
        run: |
          docker compose up -d
          timeout 90 bash -c 'until docker exec toplance_postgres pg_isready -U toplance; do sleep 2; done'
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:54330/minio/health/live; do sleep 2; done'

      - name: Migrate, seed and create the bucket
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:bucket

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
